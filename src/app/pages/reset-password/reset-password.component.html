<div class="min-h-screen flex items-center justify-center bg-surface px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-primary text-[32px]">lock_reset</span>
      </div>
      <h1 class="text-headline-lg font-headline-lg text-on-surface">Nouveau mot de passe</h1>
      <p class="text-body-md text-on-surface-variant mt-2">
        Choisissez un mot de passe sécurisé pour votre compte.
      </p>
    </div>

    <div *ngIf="invalidLink" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-body-md text-center">
      {{ error }}
      <div class="mt-3">
        <a routerLink="/forgot-password" class="text-primary font-semibold hover:underline">Demander un nouveau lien</a>
      </div>
    </div>

    <div *ngIf="success" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-body-md text-center">
      {{ success }}<br/>
      <span class="text-label-sm">Redirection vers la connexion...</span>
    </div>

    <div *ngIf="error && !invalidLink" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-body-md">
      {{ error }}
    </div>

    <form *ngIf="!invalidLink && !success" (ngSubmit)="onSubmit()" class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-6 space-y-5">
      <div class="space-y-1.5">
        <label class="text-label-md font-label-md text-on-surface-variant">Nouveau mot de passe</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
          <input [(ngModel)]="newPassword" name="newPassword" type="password" required
            class="w-full h-11 pl-10 pr-3.5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-body-md outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
            placeholder="Nouveau mot de passe"/>
        </div>
        <p class="text-label-sm text-on-surface-variant">Min. 8 caractères, une majuscule, une minuscule et un chiffre.</p>
      </div>

      <div class="space-y-1.5">
        <label class="text-label-md font-label-md text-on-surface-variant">Confirmer le mot de passe</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock_reset</span>
          <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required
            class="w-full h-11 pl-10 pr-3.5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-body-md outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
            placeholder="Confirmez le mot de passe"/>
        </div>
      </div>

      <button [disabled]="loading" type="submit"
        class="w-full h-11 bg-primary hover:bg-primary/90 disabled:bg-primary/50 text-white font-semibold text-label-md rounded-xl transition-all shadow-sm active:scale-[0.98]">
        <span *ngIf="loading">Réinitialisation en cours...</span>
        <span *ngIf="!loading">Réinitialiser le mot de passe</span>
      </button>
    </form>
  </div>
</div>
