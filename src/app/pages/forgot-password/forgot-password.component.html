<div class="min-h-screen flex items-center justify-center bg-surface px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <span class="material-symbols-outlined text-primary text-[32px]">lock_reset</span>
      </div>
      <h1 class="text-headline-lg font-headline-lg text-on-surface">Mot de passe oublié ?</h1>
      <p class="text-body-md text-on-surface-variant mt-2">
        Saisissez votre adresse email pour recevoir un lien de réinitialisation.
      </p>
    </div>

    <div *ngIf="success" class="mb-4 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-body-md text-center">
      {{ success }}
    </div>

    <div *ngIf="error" class="mb-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-body-md">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-6 space-y-5">
      <div class="space-y-1.5">
        <label class="text-label-md font-label-md text-on-surface-variant">Email professionnel</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
          <input [(ngModel)]="email" name="email" type="email" required (blur)="emailTouched = true"
            class="w-full h-11 pl-10 pr-3.5 bg-surface-container-lowest border border-outline-variant/40 rounded-xl text-body-md outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
            [ngClass]="fieldBorder(emailState)"
            placeholder="nom@entreprise.com"/>
        </div>
        @if (emailTouched && emailMessage) {
        <p class="mt-1 flex items-center gap-1 text-xs font-medium" [ngClass]="emailState === 'ok' ? 'text-emerald-600' : 'text-red-600'">
          <span class="material-symbols-outlined text-[14px]">{{ emailState === 'ok' ? 'check_circle' : 'error' }}</span>
          {{ emailMessage }}
        </p>
        }
      </div>

      <button [disabled]="loading" type="submit"
        class="w-full h-11 bg-primary hover:bg-primary/90 disabled:bg-primary/50 text-white font-semibold text-label-md rounded-xl transition-all shadow-sm active:scale-[0.98]">
        <span *ngIf="loading">Envoi en cours...</span>
        <span *ngIf="!loading">Envoyer le lien</span>
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/connexion" class="text-primary font-semibold text-label-md hover:underline">
        <span class="material-symbols-outlined align-middle text-[18px]">arrow_back</span>
        Retour à la connexion
      </a>
    </div>
  </div>
</div>
